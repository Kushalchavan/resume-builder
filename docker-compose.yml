services:
  frontend:
    build: ./client
    container_name: resume_frontend
    restart: always
    expose:
      - "80"

  backend:
    build: ./server
    container_name: resume_backend
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
